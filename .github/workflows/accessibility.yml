name: Project B accessibility tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  accessibility:
    name: Playwright accessibility suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Project B accessibility tests
        id: playwright-tests
        env:
          BOOKMARK_TARGET: b
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report after a test failure
        if: ${{ failure() && steps.playwright-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
